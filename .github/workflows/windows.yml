name: Windows build and checks
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['src/**', 'tests/**', 'scripts/**', '.github/workflows/**', 'docs/release-notes.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build, verify and package
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Verify signature-gate rejection
        shell: pwsh
        run: ./tests/signing-checks.ps1 -UnsignedAssembly src/WinWidget/bin/Release/net10.0-windows/WinWidget.dll
      - name: Render demo preview
        shell: pwsh
        run: |
          dotnet src/WinWidget/bin/Release/net10.0-windows/WinWidget.dll --smoke --output=artifacts/widget-preview.png
          if ($LASTEXITCODE -ne 0 -or !(Test-Path artifacts/widget-preview.png)) { throw 'Native render failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: WinWidget-windows-x64
          path: |
            artifacts/WinWidget-win-x64.zip
            artifacts/widget-preview.png
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME artifacts/WinWidget-win-x64.zip artifacts/widget-preview.png --title "WinWidget $env:GITHUB_REF_NAME" --notes-file docs/release-notes.md
